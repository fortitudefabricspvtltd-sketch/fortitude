<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#002435">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login - Fortitude Fabrics</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                primary: "#002435",
                "primary-container": "#063b52",
                "on-primary-container": "#7ba5c0",
                "pure-white": "#FFFFFF",
                "outline-variant": "#c1c7cd",
                "surface-container": "#eeeeeb",
                "slate-muted": "#5A7080",
                "soft-sky": "#B6D7E8",
                "error": "#ba1a1a",
                "success": "#146c2e"
              },
              fontFamily: {
                "body-main": ["Nunito Sans"],
                "section-title": ["Nunito Sans"],
                "label-caps": ["Nunito Sans"],
              }
            }
          }
        }
    </script>
</head>
<body class="bg-surface-container font-body-main text-primary min-h-screen flex items-center justify-center p-4">

    <!-- Auth loading overlay -->
    <div id="auth-loader" class="fixed inset-0 bg-surface-container flex flex-col items-center justify-center z-50">
        <span class="material-symbols-outlined text-4xl text-primary" 
              style="animation: spin 1s linear infinite">refresh</span>
        <p class="mt-4 text-slate-muted font-bold text-sm tracking-wide">Secure connection...</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <div class="bg-pure-white p-8 md:p-12 rounded-3xl shadow-lg w-full max-w-md border border-outline-variant/30">
        <div class="text-center mb-8">
            <span class="material-symbols-outlined text-5xl text-primary mb-4">admin_panel_settings</span>
            <h1 class="font-section-title text-3xl font-extrabold tracking-wide text-primary">Admin Portal</h1>
            <p class="text-slate-muted mt-2 text-sm">Sign in to manage blogs and enquiries.</p>
        </div>

        <div id="error-message" class="hidden mb-6 p-4 bg-error/10 border border-error/20 rounded-lg text-error text-sm font-bold flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">error</span>
            <span id="error-text">Invalid credentials.</span>
        </div>

        <form id="login-form" class="space-y-6">
            <div class="space-y-2">
                <label class="font-bold text-[12px] uppercase tracking-wider text-slate-muted">Email Address</label>
                <input type="email" id="email" required class="w-full bg-surface-container border-none rounded-lg py-3 px-4 focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="admin@fortitudefabric.com">
            </div>
            <div class="space-y-2">
                <label class="font-bold text-[12px] uppercase tracking-wider text-slate-muted">Password</label>
                <input type="password" id="password" required class="w-full bg-surface-container border-none rounded-lg py-3 px-4 focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="••••••••">
            </div>
            
            <button type="submit" id="login-btn" class="w-full py-4 bg-primary text-white font-bold rounded-xl hover:scale-[1.02] active:scale-95 transition-all shadow-md mt-4 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">login</span>
                <span>Sign In</span>
            </button>
        </form>
        
        <div class="mt-8 text-center">
            <a href="home.html" class="text-sm text-slate-muted hover:text-primary transition-colors flex items-center justify-center gap-1">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Back to Website
            </a>
        </div>
    </div>

    <!-- Firebase Auth Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const app = initializeApp({
          apiKey: "AIzaSyA5OU2JZdmTpjDXJILxPQ-Ypuum0Wkhk3M",
          authDomain: "fortitude-b0a25.firebaseapp.com",
          projectId: "fortitude-b0a25",
          storageBucket: "fortitude-b0a25.firebasestorage.app",
          messagingSenderId: "506151176055",
          appId: "1:506151176055:web:81a95ce6f7094f4bb8c372"
        });
        const auth = getAuth(app);

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in, redirect to admin
                window.location.href = 'admin.html';
            } else {
                // Not logged in, remove loader and show login form
                const loader = document.getElementById('auth-loader');
                if (loader) loader.remove();
            }
        });

        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const errorContainer = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // UI state
            errorContainer.classList.add('hidden');
            const originalBtnHtml = loginBtn.innerHTML;
            loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span><span>Authenticating...</span>';
            loginBtn.disabled = true;
            loginBtn.classList.add('opacity-70');

            try {
                await setPersistence(auth, browserSessionPersistence);
                await signInWithEmailAndPassword(auth, email, password);
                // The onAuthStateChanged listener above will handle redirect
            } catch (error) {
                console.error("Login error:", error);
                errorContainer.classList.remove('hidden');
                
                // Friendly error messages
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorText.textContent = "Invalid email or password.";
                } else {
                    errorText.textContent = error.message || "Failed to log in. Please try again.";
                }

                // Reset UI state
                loginBtn.innerHTML = originalBtnHtml;
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-70');
            }
        });
    </script>
</body>
</html>
